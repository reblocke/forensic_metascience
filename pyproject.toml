[project]
name = "codex_research_template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pypdf>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E266"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
